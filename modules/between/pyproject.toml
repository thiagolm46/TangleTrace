[project]
name = "tangletrace-between"
version = "0.3.0"
description = "TangleTrace BETWEEN: local reply-link annotation and review"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.5,<2", "pandas>=3,<4", "pyarrow>=23,<24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["vendor/*.md"]

[tool.setuptools.packages.find]
include = ["app*"]
